
name: Meteoritos - Sistema CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Evita que dos despliegues se ejecuten simultáneamente.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ===============================================
  # TRABAJO 1: INTEGRACION CONTINUA (CI)
  # ===============================================
  ci:
    name: "CI - Verificacion"
    runs-on: ubuntu-latest

    steps:

      - name: "1. Obtener repositorio"
        uses: actions/checkout@v7

      - name: "2. Configurar Python"
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: "3. Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "4. Ejecutar pruebas automatizadas"
        run: |
          python -m pytest tests/ -v

      - name: "5. Validar CSV completo"
        run: |
          python scripts/validar_datos.py

      - name: "6. Generar dashboard web"
        run: |
          python -m scripts.generar_sitio

      - name: "7. Verificar archivos generados"
        run: |
          test -s public/index.html
          echo "Dashboard generado correctamente"
          ls -lah public/

      - name: "8. Configurar GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "9. Preparar artefacto del sitio"
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # ===============================================
  # TRABAJO 2: DESPLIEGUE CONTINUO (CD)
  # ===============================================
  cd:
    name: "CD - Publicacion"
    runs-on: ubuntu-latest

    needs: ci

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: "10. Publicar en GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
