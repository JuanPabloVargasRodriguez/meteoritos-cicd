name: CI/CD Pipeline - Meteorite Observatory

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Permisos requeridos para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Validar, Probar y Generar Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar integridad de datos (20.000 meteoritos)
        run: |
          python scripts/validar_datos.py

      - name: Ejecutar pruebas automatizadas
        run: |
          python -m pytest tests/ -v

      - name: Generar dashboard estático
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m scripts.generar_sitio

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public/"

  deploy:
    name: Desplegar en GitHub Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

